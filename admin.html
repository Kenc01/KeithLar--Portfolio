<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Keith Brian Portfolio</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    :root {
      --bg-color: #081b29;
      --second-bg-color: #112e42;
      --text-color: #ededed;
      --main-color: #00abf0;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid rgba(0, 171, 240, 0.2);
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2rem;
      color: var(--main-color);
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--main-color);
      color: var(--bg-color);
    }

    .btn-primary:hover {
      background: #0092cc;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--main-color);
    }

    .btn-secondary:hover {
      background: rgba(0, 171, 240, 0.1);
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      background: var(--second-bg-color);
      padding: 3rem;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--main-color);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    .form-group input {
      width: 100%;
      padding: 1rem;
      border: 1px solid rgba(0, 171, 240, 0.3);
      border-radius: 5px;
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--main-color);
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      margin-top: 1rem;
    }

    .error-msg {
      color: #e74c3c;
      text-align: center;
      margin-bottom: 1rem;
      display: none;
    }

    .dashboard {
      display: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--second-bg-color);
      padding: 1.5rem;
      border-radius: 10px;
      text-align: center;
    }

    .stat-card i {
      font-size: 2.5rem;
      color: var(--main-color);
      margin-bottom: 0.5rem;
    }

    .stat-card h3 {
      font-size: 2rem;
      color: var(--main-color);
    }

    .stat-card p {
      color: rgba(237, 237, 237, 0.7);
    }

    .contacts-table {
      background: var(--second-bg-color);
      border-radius: 10px;
      overflow: hidden;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 1px solid rgba(0, 171, 240, 0.2);
    }

    .table-header h2 {
      font-size: 1.3rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 1rem 1.5rem;
      text-align: left;
      border-bottom: 1px solid rgba(0, 171, 240, 0.1);
    }

    th {
      background: rgba(0, 171, 240, 0.1);
      font-weight: 600;
      color: var(--main-color);
    }

    tr:hover {
      background: rgba(0, 171, 240, 0.05);
    }

    .message-preview {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions-cell {
      display: flex;
      gap: 0.5rem;
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--second-bg-color);
      padding: 2rem;
      border-radius: 10px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(0, 171, 240, 0.2);
    }

    .modal-header h3 {
      color: var(--main-color);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .detail-row {
      margin-bottom: 1rem;
    }

    .detail-row label {
      display: block;
      color: var(--main-color);
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }

    .detail-row p {
      padding: 0.8rem;
      background: var(--bg-color);
      border-radius: 5px;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: rgba(237, 237, 237, 0.5);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      .header {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div id="login-page" class="login-container">
    <div class="login-box">
      <h2><i class='bx bxs-lock-alt'></i> Admin Login</h2>
      <p id="login-error" class="error-msg"></p>
      <form id="login-form">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn btn-primary login-btn">
          <i class='bx bx-log-in'></i> Login
        </button>
      </form>
      <p style="text-align: center; margin-top: 1.5rem;">
        <a href="/" style="color: var(--main-color);">
          <i class='bx bx-arrow-back'></i> Back to Portfolio
        </a>
      </p>
    </div>
  </div>

  <div id="dashboard-page" class="dashboard">
    <div class="container">
      <div class="header">
        <h1><i class='bx bxs-dashboard'></i> Admin Dashboard</h1>
        <div class="header-actions">
          <a href="/" class="btn btn-secondary">
            <i class='bx bx-home'></i> View Portfolio
          </a>
          <button id="logout-btn" class="btn btn-danger">
            <i class='bx bx-log-out'></i> Logout
          </button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <i class='bx bx-message-square-dots'></i>
          <h3 id="total-messages">0</h3>
          <p>Total Messages</p>
        </div>
        <div class="stat-card">
          <i class='bx bx-calendar'></i>
          <h3 id="today-messages">0</h3>
          <p>Today's Messages</p>
        </div>
      </div>

      <div class="contacts-table">
        <div class="table-header">
          <h2><i class='bx bx-envelope'></i> Contact Submissions</h2>
          <button id="refresh-btn" class="btn btn-secondary btn-sm">
            <i class='bx bx-refresh'></i> Refresh
          </button>
        </div>
        <div id="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Message</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="contacts-body">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="message-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class='bx bx-message-detail'></i> Message Details</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-body"></div>
      <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        <button id="modal-delete-btn" class="btn btn-danger">
          <i class='bx bx-trash'></i> Delete
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentContactId = null;

    async function checkAuth() {
      try {
        const response = await fetch('/api/admin/check');
        const data = await response.json();
        if (data.authenticated) {
          showDashboard();
          loadContacts();
        }
      } catch (error) {
        console.error('Auth check failed:', error);
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showDashboard();
          loadContacts();
        } else {
          errorEl.textContent = data.error || 'Invalid password';
          errorEl.style.display = 'block';
        }
      } catch (error) {
        errorEl.textContent = 'Login failed. Please try again.';
        errorEl.style.display = 'block';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        await fetch('/api/admin/logout', { method: 'POST' });
        showLogin();
      } catch (error) {
        console.error('Logout failed:', error);
      }
    });

    document.getElementById('refresh-btn').addEventListener('click', loadContacts);

    function showDashboard() {
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('dashboard-page').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('login-page').style.display = 'flex';
      document.getElementById('dashboard-page').style.display = 'none';
      document.getElementById('password').value = '';
      document.getElementById('login-error').style.display = 'none';
    }

    async function loadContacts() {
      try {
        const response = await fetch('/api/admin/contacts');
        const data = await response.json();
        
        if (!data.success) {
          if (response.status === 401) {
            showLogin();
            return;
          }
          throw new Error(data.error);
        }
        
        const contacts = data.contacts;
        const tbody = document.getElementById('contacts-body');
        
        document.getElementById('total-messages').textContent = contacts.length;
        
        const today = new Date().toDateString();
        const todayCount = contacts.filter(c => 
          new Date(c.created_at).toDateString() === today
        ).length;
        document.getElementById('today-messages').textContent = todayCount;
        
        if (contacts.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  <i class='bx bx-inbox'></i>
                  <p>No messages yet</p>
                </div>
              </td>
            </tr>
          `;
          return;
        }
        
        tbody.innerHTML = contacts.map(contact => `
          <tr>
            <td>${new Date(contact.created_at).toLocaleDateString()}</td>
            <td>${escapeHtml(contact.full_name)}</td>
            <td><a href="mailto:${escapeHtml(contact.email)}" style="color: var(--main-color);">${escapeHtml(contact.email)}</a></td>
            <td>${escapeHtml(contact.subject || '-')}</td>
            <td class="message-preview">${escapeHtml(contact.message)}</td>
            <td class="actions-cell">
              <button class="btn btn-primary btn-sm" onclick="viewContact(${contact.id})">
                <i class='bx bx-show'></i>
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteContact(${contact.id})">
                <i class='bx bx-trash'></i>
              </button>
            </td>
          </tr>
        `).join('');
      } catch (error) {
        console.error('Failed to load contacts:', error);
      }
    }

    async function viewContact(id) {
      try {
        const response = await fetch(`/api/admin/contacts/${id}`);
        const data = await response.json();
        
        if (!data.success) throw new Error(data.error);
        
        const contact = data.contact;
        currentContactId = id;
        
        document.getElementById('modal-body').innerHTML = `
          <div class="detail-row">
            <label>Date</label>
            <p>${new Date(contact.created_at).toLocaleString()}</p>
          </div>
          <div class="detail-row">
            <label>Full Name</label>
            <p>${escapeHtml(contact.full_name)}</p>
          </div>
          <div class="detail-row">
            <label>Email</label>
            <p><a href="mailto:${escapeHtml(contact.email)}" style="color: var(--main-color);">${escapeHtml(contact.email)}</a></p>
          </div>
          <div class="detail-row">
            <label>Mobile</label>
            <p>${escapeHtml(contact.mobile || 'Not provided')}</p>
          </div>
          <div class="detail-row">
            <label>Subject</label>
            <p>${escapeHtml(contact.subject || 'Not provided')}</p>
          </div>
          <div class="detail-row">
            <label>Message</label>
            <p style="white-space: pre-wrap;">${escapeHtml(contact.message)}</p>
          </div>
        `;
        
        document.getElementById('modal-delete-btn').onclick = () => {
          deleteContact(id);
          closeModal();
        };
        
        document.getElementById('message-modal').style.display = 'flex';
      } catch (error) {
        console.error('Failed to view contact:', error);
      }
    }

    async function deleteContact(id) {
      if (!confirm('Are you sure you want to delete this message?')) return;
      
      try {
        const response = await fetch(`/api/admin/contacts/${id}`, {
          method: 'DELETE'
        });
        
        const data = await response.json();
        if (data.success) {
          loadContacts();
        } else {
          alert('Failed to delete message');
        }
      } catch (error) {
        console.error('Failed to delete contact:', error);
      }
    }

    function closeModal() {
      document.getElementById('message-modal').style.display = 'none';
      currentContactId = null;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('message-modal').addEventListener('click', (e) => {
      if (e.target.id === 'message-modal') closeModal();
    });

    checkAuth();
  </script>
</body>
</html>
