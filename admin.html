<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Keith Brian Portfolio</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    :root {
      --bg-color: #081b29;
      --second-bg-color: #112e42;
      --text-color: #ededed;
      --main-color: #00abf0;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid rgba(0, 171, 240, 0.2);
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2rem;
      color: var(--main-color);
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--main-color);
      color: var(--bg-color);
    }

    .btn-primary:hover {
      background: #0092cc;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--main-color);
    }

    .btn-secondary:hover {
      background: rgba(0, 171, 240, 0.1);
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .btn-success {
      background: #27ae60;
      color: white;
    }

    .btn-success:hover {
      background: #219a52;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      background: var(--second-bg-color);
      padding: 3rem;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--main-color);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 1rem;
      border: 1px solid rgba(0, 171, 240, 0.3);
      border-radius: 5px;
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 1rem;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--main-color);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      margin-top: 1rem;
    }

    .error-msg {
      color: #e74c3c;
      text-align: center;
      margin-bottom: 1rem;
      display: none;
    }

    .dashboard {
      display: none;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .tab-btn {
      padding: 1rem 2rem;
      background: var(--second-bg-color);
      border: 1px solid rgba(0, 171, 240, 0.2);
      border-radius: 5px;
      color: var(--text-color);
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--main-color);
      color: var(--bg-color);
      border-color: var(--main-color);
    }

    .tab-btn:hover:not(.active) {
      background: rgba(0, 171, 240, 0.1);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--second-bg-color);
      padding: 1.5rem;
      border-radius: 10px;
      text-align: center;
    }

    .stat-card i {
      font-size: 2.5rem;
      color: var(--main-color);
      margin-bottom: 0.5rem;
    }

    .stat-card h3 {
      font-size: 2rem;
      color: var(--main-color);
    }

    .stat-card p {
      color: rgba(237, 237, 237, 0.7);
    }

    .data-table {
      background: var(--second-bg-color);
      border-radius: 10px;
      overflow: hidden;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 1px solid rgba(0, 171, 240, 0.2);
    }

    .table-header h2 {
      font-size: 1.3rem;
    }

    .table-actions {
      display: flex;
      gap: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 1rem 1.5rem;
      text-align: left;
      border-bottom: 1px solid rgba(0, 171, 240, 0.1);
    }

    th {
      background: rgba(0, 171, 240, 0.1);
      font-weight: 600;
      color: var(--main-color);
    }

    tr:hover {
      background: rgba(0, 171, 240, 0.05);
    }

    .message-preview {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions-cell {
      display: flex;
      gap: 0.5rem;
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--second-bg-color);
      padding: 2rem;
      border-radius: 10px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(0, 171, 240, 0.2);
    }

    .modal-header h3 {
      color: var(--main-color);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .detail-row {
      margin-bottom: 1rem;
    }

    .detail-row label {
      display: block;
      color: var(--main-color);
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }

    .detail-row p {
      padding: 0.8rem;
      background: var(--bg-color);
      border-radius: 5px;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: rgba(237, 237, 237, 0.5);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem;
    }

    .portfolio-card {
      background: var(--bg-color);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(0, 171, 240, 0.2);
    }

    .portfolio-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: rgba(0, 171, 240, 0.1);
    }

    .portfolio-card-content {
      padding: 1rem;
    }

    .portfolio-card h4 {
      color: var(--main-color);
      margin-bottom: 0.5rem;
    }

    .portfolio-card p {
      font-size: 0.9rem;
      color: rgba(237, 237, 237, 0.7);
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .portfolio-card-actions {
      display: flex;
      gap: 0.5rem;
    }

    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      .header {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }

      .tabs {
        flex-wrap: wrap;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div id="login-page" class="login-container">
    <div class="login-box">
      <h2><i class='bx bxs-lock-alt'></i> Admin Login</h2>
      <p id="login-error" class="error-msg"></p>
      <form id="login-form">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn btn-primary login-btn">
          <i class='bx bx-log-in'></i> Login
        </button>
      </form>
      <p style="text-align: center; margin-top: 1.5rem;">
        <a href="index.html" style="color: var(--main-color);">
          <i class='bx bx-arrow-back'></i> Back to Portfolio
        </a>
      </p>
    </div>
  </div>

  <div id="dashboard-page" class="dashboard">
    <div class="container">
      <div class="header">
        <h1><i class='bx bxs-dashboard'></i> Admin Dashboard</h1>
        <div class="header-actions">
          <a href="index.html" class="btn btn-secondary">
            <i class='bx bx-home'></i> View Portfolio
          </a>
          <button id="logout-btn" class="btn btn-danger">
            <i class='bx bx-log-out'></i> Logout
          </button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('messages')">
          <i class='bx bx-envelope'></i> Messages
        </button>
        <button class="tab-btn" onclick="switchTab('portfolio')">
          <i class='bx bx-briefcase'></i> Portfolio
        </button>
      </div>

      <div id="messages-tab" class="tab-content active">
        <div class="stats-grid">
          <div class="stat-card">
            <i class='bx bx-message-square-dots'></i>
            <h3 id="total-messages">0</h3>
            <p>Total Messages</p>
          </div>
          <div class="stat-card">
            <i class='bx bx-calendar'></i>
            <h3 id="today-messages">0</h3>
            <p>Today's Messages</p>
          </div>
        </div>

        <div class="data-table">
          <div class="table-header">
            <h2><i class='bx bx-envelope'></i> Contact Submissions</h2>
            <button id="refresh-btn" class="btn btn-secondary btn-sm" onclick="loadContacts()">
              <i class='bx bx-refresh'></i> Refresh
            </button>
          </div>
          <div id="table-container">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Subject</th>
                  <th>Message</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="contacts-body">
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="portfolio-tab" class="tab-content">
        <div class="stats-grid">
          <div class="stat-card">
            <i class='bx bx-briefcase'></i>
            <h3 id="total-projects">0</h3>
            <p>Total Projects</p>
          </div>
        </div>

        <div class="data-table">
          <div class="table-header">
            <h2><i class='bx bx-briefcase'></i> Portfolio Items</h2>
            <div class="table-actions">
              <button class="btn btn-secondary btn-sm" onclick="loadPortfolio()">
                <i class='bx bx-refresh'></i> Refresh
              </button>
              <button class="btn btn-primary btn-sm" onclick="openPortfolioModal()">
                <i class='bx bx-plus'></i> Add Project
              </button>
            </div>
          </div>
          <div id="portfolio-container" class="portfolio-grid">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="message-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class='bx bx-message-detail'></i> Message Details</h3>
        <button class="close-btn" onclick="closeModal('message-modal')">&times;</button>
      </div>
      <div id="modal-body"></div>
      <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
        <button class="btn btn-secondary" onclick="closeModal('message-modal')">Close</button>
        <button id="modal-delete-btn" class="btn btn-danger">
          <i class='bx bx-trash'></i> Delete
        </button>
      </div>
    </div>
  </div>

  <div id="portfolio-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="portfolio-modal-title"><i class='bx bx-briefcase'></i> Add Project</h3>
        <button class="close-btn" onclick="closeModal('portfolio-modal')">&times;</button>
      </div>
      <form id="portfolio-form">
        <input type="hidden" id="portfolio-id">
        <div class="form-group">
          <label for="portfolio-title">Project Title *</label>
          <input type="text" id="portfolio-title" placeholder="Enter project title" required>
        </div>
        <div class="form-group">
          <label for="portfolio-description">Description *</label>
          <textarea id="portfolio-description" placeholder="Enter project description" required></textarea>
        </div>
        <div class="form-group">
          <label for="portfolio-image">Image URL</label>
          <input type="text" id="portfolio-image" placeholder="Enter image URL (e.g., images-2/portfolio1.jpg)">
        </div>
        <div class="form-group">
          <label for="portfolio-url">Project URL</label>
          <input type="text" id="portfolio-url" placeholder="Enter project link (optional)">
        </div>
        <div class="form-group">
          <label for="portfolio-order">Display Order</label>
          <input type="number" id="portfolio-order" placeholder="0" value="0">
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('portfolio-modal')">Cancel</button>
          <button type="submit" class="btn btn-success">
            <i class='bx bx-save'></i> Save Project
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentContactId = null;
    let editingPortfolioId = null;

    async function checkAuth() {
      try {
        const response = await fetch('/api/admin/check');
        const data = await response.json();
        if (data.authenticated) {
          showDashboard();
          loadContacts();
          loadPortfolio();
        }
      } catch (error) {
        console.error('Auth check failed:', error);
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showDashboard();
          loadContacts();
          loadPortfolio();
        } else {
          errorEl.textContent = data.error || 'Invalid password';
          errorEl.style.display = 'block';
        }
      } catch (error) {
        errorEl.textContent = 'Login failed. Please try again.';
        errorEl.style.display = 'block';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        await fetch('/api/admin/logout', { method: 'POST' });
        showLogin();
      } catch (error) {
        console.error('Logout failed:', error);
      }
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.closest('.tab-btn').classList.add('active');
      document.getElementById(tab + '-tab').classList.add('active');
    }

    function showDashboard() {
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('dashboard-page').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('login-page').style.display = 'flex';
      document.getElementById('dashboard-page').style.display = 'none';
      document.getElementById('password').value = '';
      document.getElementById('login-error').style.display = 'none';
    }

    async function loadContacts() {
      try {
        const response = await fetch('/api/admin/contacts');
        const data = await response.json();
        
        if (!data.success) {
          if (response.status === 401) {
            showLogin();
            return;
          }
          throw new Error(data.error);
        }
        
        const contacts = data.contacts;
        const tbody = document.getElementById('contacts-body');
        
        document.getElementById('total-messages').textContent = contacts.length;
        
        const today = new Date().toDateString();
        const todayCount = contacts.filter(c => 
          new Date(c.created_at).toDateString() === today
        ).length;
        document.getElementById('today-messages').textContent = todayCount;
        
        if (contacts.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  <i class='bx bx-inbox'></i>
                  <p>No messages yet</p>
                </div>
              </td>
            </tr>
          `;
          return;
        }
        
        tbody.innerHTML = contacts.map(contact => `
          <tr>
            <td>${new Date(contact.created_at).toLocaleDateString()}</td>
            <td>${escapeHtml(contact.full_name)}</td>
            <td><a href="mailto:${escapeHtml(contact.email)}" style="color: var(--main-color);">${escapeHtml(contact.email)}</a></td>
            <td>${escapeHtml(contact.subject || '-')}</td>
            <td class="message-preview">${escapeHtml(contact.message)}</td>
            <td class="actions-cell">
              <button class="btn btn-primary btn-sm" onclick="viewContact(${contact.id})">
                <i class='bx bx-show'></i>
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteContact(${contact.id})">
                <i class='bx bx-trash'></i>
              </button>
            </td>
          </tr>
        `).join('');
      } catch (error) {
        console.error('Failed to load contacts:', error);
      }
    }

    async function loadPortfolio() {
      try {
        const response = await fetch('/api/admin/portfolio');
        const data = await response.json();
        
        if (!data.success) {
          if (response.status === 401) {
            showLogin();
            return;
          }
          throw new Error(data.error);
        }
        
        const items = data.items;
        const container = document.getElementById('portfolio-container');
        
        document.getElementById('total-projects').textContent = items.length;
        
        if (items.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <i class='bx bx-briefcase'></i>
              <p>No projects yet. Click "Add Project" to create your first one.</p>
            </div>
          `;
          return;
        }
        
        container.innerHTML = items.map(item => `
          <div class="portfolio-card">
            <img src="${escapeHtml(item.image_url) || 'images-2/portfolio1.jpg'}" alt="${escapeHtml(item.title)}" onerror="this.src='images-2/portfolio1.jpg'">
            <div class="portfolio-card-content">
              <h4>${escapeHtml(item.title)}</h4>
              <p>${escapeHtml(item.description)}</p>
              <div class="portfolio-card-actions">
                <button class="btn btn-primary btn-sm" onclick="editPortfolio(${item.id})">
                  <i class='bx bx-edit'></i> Edit
                </button>
                <button class="btn btn-danger btn-sm" onclick="deletePortfolio(${item.id})">
                  <i class='bx bx-trash'></i>
                </button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load portfolio:', error);
      }
    }

    function openPortfolioModal(item = null) {
      editingPortfolioId = item ? item.id : null;
      document.getElementById('portfolio-modal-title').innerHTML = item 
        ? "<i class='bx bx-edit'></i> Edit Project" 
        : "<i class='bx bx-briefcase'></i> Add Project";
      
      document.getElementById('portfolio-id').value = item?.id || '';
      document.getElementById('portfolio-title').value = item?.title || '';
      document.getElementById('portfolio-description').value = item?.description || '';
      document.getElementById('portfolio-image').value = item?.image_url || '';
      document.getElementById('portfolio-url').value = item?.project_url || '';
      document.getElementById('portfolio-order').value = item?.display_order || 0;
      
      document.getElementById('portfolio-modal').style.display = 'flex';
    }

    async function editPortfolio(id) {
      try {
        const response = await fetch('/api/admin/portfolio');
        const data = await response.json();
        const item = data.items.find(i => i.id === id);
        if (item) {
          openPortfolioModal(item);
        }
      } catch (error) {
        console.error('Failed to load portfolio item:', error);
      }
    }

    document.getElementById('portfolio-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = document.getElementById('portfolio-id').value;
      const portfolioData = {
        title: document.getElementById('portfolio-title').value,
        description: document.getElementById('portfolio-description').value,
        image_url: document.getElementById('portfolio-image').value,
        project_url: document.getElementById('portfolio-url').value,
        display_order: parseInt(document.getElementById('portfolio-order').value) || 0
      };
      
      try {
        const url = id ? `/api/admin/portfolio/${id}` : '/api/admin/portfolio';
        const method = id ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(portfolioData)
        });
        
        const data = await response.json();
        
        if (data.success) {
          closeModal('portfolio-modal');
          loadPortfolio();
        } else {
          alert(data.error || 'Failed to save project');
        }
      } catch (error) {
        console.error('Failed to save portfolio:', error);
        alert('Failed to save project. Please try again.');
      }
    });

    async function deletePortfolio(id) {
      if (!confirm('Are you sure you want to delete this project?')) return;
      
      try {
        const response = await fetch(`/api/admin/portfolio/${id}`, {
          method: 'DELETE'
        });
        
        const data = await response.json();
        if (data.success) {
          loadPortfolio();
        } else {
          alert('Failed to delete project');
        }
      } catch (error) {
        console.error('Failed to delete portfolio:', error);
      }
    }

    async function viewContact(id) {
      try {
        const response = await fetch(`/api/admin/contacts/${id}`);
        const data = await response.json();
        
        if (!data.success) throw new Error(data.error);
        
        const contact = data.contact;
        currentContactId = id;
        
        document.getElementById('modal-body').innerHTML = `
          <div class="detail-row">
            <label>Date</label>
            <p>${new Date(contact.created_at).toLocaleString()}</p>
          </div>
          <div class="detail-row">
            <label>Full Name</label>
            <p>${escapeHtml(contact.full_name)}</p>
          </div>
          <div class="detail-row">
            <label>Email</label>
            <p><a href="mailto:${escapeHtml(contact.email)}" style="color: var(--main-color);">${escapeHtml(contact.email)}</a></p>
          </div>
          <div class="detail-row">
            <label>Mobile</label>
            <p>${escapeHtml(contact.mobile || 'Not provided')}</p>
          </div>
          <div class="detail-row">
            <label>Subject</label>
            <p>${escapeHtml(contact.subject || 'Not provided')}</p>
          </div>
          <div class="detail-row">
            <label>Message</label>
            <p style="white-space: pre-wrap;">${escapeHtml(contact.message)}</p>
          </div>
        `;
        
        document.getElementById('modal-delete-btn').onclick = () => {
          deleteContact(id);
          closeModal('message-modal');
        };
        
        document.getElementById('message-modal').style.display = 'flex';
      } catch (error) {
        console.error('Failed to view contact:', error);
      }
    }

    async function deleteContact(id) {
      if (!confirm('Are you sure you want to delete this message?')) return;
      
      try {
        const response = await fetch(`/api/admin/contacts/${id}`, {
          method: 'DELETE'
        });
        
        const data = await response.json();
        if (data.success) {
          loadContacts();
        } else {
          alert('Failed to delete message');
        }
      } catch (error) {
        console.error('Failed to delete contact:', error);
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
      if (modalId === 'message-modal') currentContactId = null;
      if (modalId === 'portfolio-modal') editingPortfolioId = null;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('message-modal').addEventListener('click', (e) => {
      if (e.target.id === 'message-modal') closeModal('message-modal');
    });

    document.getElementById('portfolio-modal').addEventListener('click', (e) => {
      if (e.target.id === 'portfolio-modal') closeModal('portfolio-modal');
    });

    checkAuth();
  </script>
</body>
</html>
